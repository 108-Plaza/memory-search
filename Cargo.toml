[package]
name = "memory-search"
version = "0.1.0"
edition = "2021"
description = "Semantic search MCP server over the pos108 shared memory store"

[dependencies]
fastembed = "5"
anyhow = "1"
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "spike"
path = "src/bin/spike.rs"

[[bin]]
name = "memory-search"
path = "src/main.rs"

[profile.release]
lto = "thin"
